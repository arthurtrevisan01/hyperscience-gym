<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperScience Elite</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
}
.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
}
.premium-card {
    background: linear-gradient(145deg,#0f172a,#1e293b);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.fade-in {
    animation: fade 0.4s ease;
}
@keyframes fade {
    from { opacity:0; transform: translateY(10px); }
    to { opacity:1; transform: translateY(0); }
}
</style>
</head>

<body class="text-gray-200 min-h-screen">

<div id="app" class="max-w-5xl mx-auto p-6 fade-in"></div>

<script>

// ============================
// ESTADO GLOBAL
// ============================

const appState = {
    currentView: 'home',
    activeWorkout: null,
    history: JSON.parse(localStorage.getItem("hyperHistory")) || [],
    streak: parseInt(localStorage.getItem("hyperStreak")) || 0
};

// ============================
// PLANOS ABC (mantidos)
// ============================

const WORKOUT_PLANS = {
    A: {
        name: "Treino A - Peito/Ombro/Tríceps",
        exercises: [
            { name: "Supino Reto", sets: 4 },
            { name: "Supino Inclinado", sets: 3 },
            { name: "Desenvolvimento", sets: 3 },
            { name: "Elevação Lateral", sets: 3 },
            { name: "Tríceps Testa", sets: 3 }
        ]
    },
    B: {
        name: "Treino B - Costas/Bíceps",
        exercises: [
            { name: "Puxada Frontal", sets: 4 },
            { name: "Remada Curvada", sets: 3 },
            { name: "Remada Baixa", sets: 3 },
            { name: "Rosca Direta", sets: 3 },
            { name: "Rosca Alternada", sets: 3 }
        ]
    },
    C: {
        name: "Treino C - Pernas",
        exercises: [
            { name: "Agachamento", sets: 4 },
            { name: "Leg Press", sets: 3 },
            { name: "Cadeira Extensora", sets: 3 },
            { name: "Mesa Flexora", sets: 3 },
            { name: "Panturrilha", sets: 4 }
        ]
    }
};

// ============================
// RENDER PRINCIPAL
// ============================

function render() {
    const app = document.getElementById("app");

    if (appState.currentView === 'home') renderHome(app);
    if (appState.currentView === 'workout') renderWorkout(app);
    if (appState.currentView === 'history') renderHistory(app);
    if (appState.currentView === 'result') renderResult(app);
}

// ============================
// HOME
// ============================

function renderHome(app) {
    app.innerHTML = `
    <div class="text-center mb-10">
        <h1 class="text-4xl font-extrabold mb-2">HyperScience</h1>
        <p class="text-gray-400">Performance. Dados. Evolução.</p>
    </div>

    <div class="glass p-4 rounded-xl mb-6 text-center">
        🔥 Streak Atual: <span class="font-bold text-green-400">${appState.streak} dias</span>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        ${Object.keys(WORKOUT_PLANS).map(key => `
            <div onclick="startWorkout('${key}')" 
                 class="premium-card p-6 rounded-xl cursor-pointer hover:scale-105 transition">
                <h2 class="text-xl font-bold mb-2">${WORKOUT_PLANS[key].name}</h2>
                <p class="text-gray-400 text-sm">Clique para iniciar</p>
            </div>
        `).join('')}
    </div>

    <div class="text-center mt-10">
        <button onclick="goToHistory()" 
        class="bg-indigo-600 px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700">
        Ver Histórico
        </button>
    </div>
    `;
}

// ============================
// INICIAR TREINO
// ============================

function startWorkout(planKey) {
    const plan = WORKOUT_PLANS[planKey];

    appState.activeWorkout = {
        plan: plan.name,
        startTime: new Date(),
        exercises: plan.exercises.map(ex => ({
            name: ex.name,
            sets: Array.from({length: ex.sets}, () => ({
                weight: "",
                reps: "",
                rpe: ""
            }))
        }))
    };

    appState.currentView = 'workout';
    render();
}

// ============================
// RENDER TREINO
// ============================

function renderWorkout(app) {

    app.innerHTML = `
    <div class="mb-6">
        <button onclick="goHome()" class="text-sm text-gray-400">← Voltar</button>
        <h2 class="text-2xl font-bold mt-2">${appState.activeWorkout.plan}</h2>
    </div>

    ${appState.activeWorkout.exercises.map((ex, exIndex) => `
        <div class="glass p-4 rounded-xl mb-6 relat
